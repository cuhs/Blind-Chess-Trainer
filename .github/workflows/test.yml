name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chess-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@mindboard/chess-core
      - run: npm run validate:puzzles --workspace=@mindboard/chess-core
      - run: npm run validate:curriculum --workspace=@mindboard/chess-core
      - run: npm run validate:generators --workspace=@mindboard/chess-core

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@mindboard/mobile
